<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | Rueda libre</title>
    <meta name="description" content="Haz una reservación de nuestras bicicletas.">
    <meta name="author" content="Rueda Libre">
        <!-- Montserrat 700 and OpenSans 400 & 600 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&family=Open+Sans:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <nav style="display: flex; background-color: #7c7b7b; ">
        <ul style="display: flex; flex-direction: row; gap: 1rem; list-style-type: none;">
            <li><a style="text-decoration: none; color: #fff;" href="/index.html">Inicio</a></li>
            <li><a style="text-decoration: none; color: #fff;" href="/paginas/tarifas.html">Tarifas y rutas</a></li>
            <li><a style="text-decoration: none; color: #fff;" href="/paginas/reservas.html">Reservas</a></li>
        </ul>
    </nav>
    <header>
        <center>
            <a href="../index.html"><img src="../img/cover.jpg" alt="Portada Rueda Libre" width="768"></a>
            <h1>Reserva tu bicicleta</h1>
        </center>
    </header>

    <main>
        <section id="formulario">
            <form action="/solicitar-reserva" method="post">
                <fieldset>
                    <legend>Tus datos</legend>
                    <label for="name">Nombre Completo:</label>
                    <input type="text" id="name" name="name" placeholder="Nombre Apellido" required minlength="3"
                        maxlength="100"><br><br>

                    <label for="identification">Número de documento:</label>
                    <input type="number" id="identification" name="identification" placeholder="10000000" min="100000"
                        max="9999999999" required><br><br>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@example.com" required><br><br>

                    <label for="phone">Celular:</label>
                    <input type="tel" id="phone" name="phone" placeholder="3001001000" pattern="3[0-9]{9}"
                        required><br><br>
                </fieldset>

                <fieldset>
                    <legend>Tu alquiler</legend>
                    <label for="reservation-date">Fecha de alquiler:</label>
                    <input type="date" id="reservation-date" name="reservation-date" required min="2026-11-01"
                        max="2026-12-31"><br><br>

                    <label for="bike-type">Tipo de bicicleta:</label>
                    <select id="bike-type" name="bike-type" required>
                        <option value="" disabled selected>Seleccione un tipo</option>
                        <option value="urbana">Urbana</option>
                        <option value="montaña">Montaña</option>
                        <option value="eléctrica">Eléctrica</option>
                    </select>
                    <label for="plan">Plan:</label>
                    <select id="plan" required>
                        <option value="1">1 hora</option>
                        <option value="2">Medio día</option>
                        <option value="3">Día completo</option>
                    </select><br><br>

                    <label for="bycicles-count">Cantidad de bicicletas:</label>
                    <input type="number" id="bycicles-count" name="bycicles-count" min="1" max="6" value="1"
                        required><br><br>


                    <label for="tour">Recorrido guiado:</label>
                    <select id="tour" name="tour" required>
                        <option value="" disabled selected>Seleccione un recorrido</option>
                        <option value="rio-parques">Río y Parques</option>
                        <option value="cultura-historia">Sabores de Barrio</option>
                        <option value="miradores">Reto de Las Palmas</option>
                    </select><br><br>
                </fieldset>
                <fieldset>
                    <legend>Confirmación</legend>
                    <label for="comments">Comentarios adicionales:</label><br>
                    <textarea id="comments" name="comments" rows="4" cols="50" maxlength="300"
                        placeholder="(Opcional) Escribe aquí cualquier comentario o solicitud especial..."></textarea><br>
                    <label for="accept-terms">
                        <input type="checkbox" id="accept-terms" name="accept-terms" required>
                        Acepto que he leído los <a href="/#" target="_blank">términos y condiciones</a> .
                    </label>
                </fieldset>
                <br>
                <input type="submit" value="Reservar">
            </form>
        </section>
        <section id="schedule">
            <h2>Horarios</h2>
            <dl>
                <dt>Lunes a viernes</dt>
                <dd>
                    7:00 a.m a 7:00 p.m
                </dd>

                <dt>Sábados, domingos y festivos</dt>
                <dd>
                    6:00 a.m a 2:00 p.m
                </dd>
            </dl>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Rueda Libre · <a href="mailto:hola@ruedalibre.example">hola@ruedalibre.example</a></p>
    </footer>
</body>

</html>
